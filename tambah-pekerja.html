<body>
     <!-- SIDEBAR -->

            <img src="./assets/images/logo-pantau-hadir.jpg"
                 width="150"
                 alt="Pantau Hadir - Sistem Absensi Pekerja Proyek">

        <nav>

  <!-- KONTEN UTAMA -->
  <div>
    <header>
            <h2>PT. Jalan Baru</h2>
            <div>
                <span>Admin</span>
                <img src="./assets/images/icons/users.svg" width="10" alt="">
            </div>
        </header>

    <!-- ISI HALAMAN -->
    <main>
      <h1>Tambah Data Pekerja</h1>
      <p>Masukkan data pekerja baru ke dalam sistem.</p>

      <form action="#" method="post">

        <div>
          <label for="nama">Nama Pekerja</label><br>
          <input type="text" id="nama" name="nama" placeholder="Masukan nama lengkap pekerja">
        </div>

        <div>
          <label for="nik">NIK</label><br>
          <input type="text" id="nik" name="nik" placeholder="Masukan 16 digit NIK" maxlength="16">
        </div>

        <div>
          <label for="lokasi">Lokasi Kerja</label><br>
          <select id="lokasi" name="lokasi">
            <option value="">Pilih lokasi proyek</option>
          </select>
        </div>

        <div>
          <label for="password">Buat Password Baru</label><br>
          <input type="password" id="password" name="password" placeholder="Masukan password baru"> <img src="./assets/images/icons/eye-off.svg" width="10" alt="">  
          
        </div>

        <div>
          <button type="button">Batal <img src="./assets/images/icons/circle-x.svg" width="10" alt=""></button> 
          <button type="submit">Simpan <img src="./assets/images/icons/save-check.svg" width="10" alt=""></button> 
        </div>

      </form>
    </main>

  </div>

  <p>© 2026 Pantau Hadir App<br>Sistem Absensi Pekerja Proyek</p>
</body>
