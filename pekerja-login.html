<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantau Hadir — Masuk (Pekerja)</title>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">
        <img src="./assets/images/icons/undo-2.svg" alt="Ikon Kembali">
      </a>
    </nav>

    <figure>
      <img width="100" height="100" src="./assets/images/logo-pantau-hadir.svg" alt="Logo Pantau Hadir - Sistem Absensi Pekerja Proyek">
    </figure>
  </header>

  <main>
    <h1>MASUK</h1>

    <form action="pekerja-dashboard.html" method="post">
      <p>
        <label for="id-perusahaan">ID Perusahaan</label>
        <input
          type="text"
          id="id-perusahaan"
          name="id-perusahaan"
          placeholder="Masukkan ID Perusahaan"
          required
          autofocus
        >
      </p>

      <p>
        <label for="nik">NIK</label>
        <input
          type="text"
          id="nik"
          name="nik"
          placeholder="Masukkan NIK"
          autocomplete="username"
          inputmode="numeric"
          required
        >
      </p>

      <p>
        <label for="kata-sandi">Kata Sandi</label>
        <input
          type="password"
          id="kata-sandi"
          name="kata-sandi"
          placeholder="Masukkan Kata Sandi"
          autocomplete="current-password"
          required
        >
        <button type="button" id="togglePassword" aria-label="Tampilkan/sembunyikan kata sandi">
            <img src="./assets/images/icons/eye-off.svg" width="10" alt="Toggle sandi">
        </button>
      </p>

      <p>
        <button type="submit">
          <img src="./assets/images/icons/log-in.svg" alt="">
          Masuk
        </button>
      </p>
    </form>
  </main>

  <footer>
    <img src="./assets/images/images-konstruksi-biru.jpg" alt="Background Ilustrasi Kontstruksi" width="400" height="200">
    <!-- dikerjakan oleh Kintan Aulia -->
  </footer>
</body>
</html>
