  <!-- SIDEBAR -->

    <main>

        <header>
            <h2>PT. Jalan Baru</h2>
            <div>

                <img src="./assets/images/icons/users.svg" width="10" alt="">

        </header>


        <!-- DASHBOARD -->
        <section>
            <h1>Dashboard</h1>
            <p>

            <div>

                    <strong>Senin, 28 September 2026</strong>

            <div>

                <h2>STATISTIK HARI INI</h2>
                <section>

                    <h2><img src="asset/icons/hard-hat.svg" width="20" alt=""> 45</h2>

                <section>

                    <h3>Hadir</h3>
                    <h2><img src="asset/icons/circle-check.svg" width="20" alt=""> 45</h2>

                </section>

                <!-- TIDAK HADIR -->
                <section>

                    <h3>Tidak Hadir</h3>
                    <h2><img src="asset/icons/circle-x.svg" width="20" alt=""> 0</h2>

            <!-- ILUSTRASI -->
            <div>
                <img src="asset/images/images-konstruksi-biru.jpg" width="400" alt="">
