<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pekerja — Pantau Hadir</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Cpath d='M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1z'/%3E%3Cpath d='M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5'/%3E%3C/svg%3E">
</head>
<body class="worker-body">
  <div class="worker-wrap">
    <div class="w-topbar">
      <div class="w-logo">
        <div class="logo-mark" id="logo"></div>
        <span>Pantau Hadir</span>
      </div>
      <a href="#" class="w-logout" data-logout><span id="i-out"></span> Keluar</a>
    </div>

    <!-- Site & clock card -->
    <div class="site-card">
      <h1 id="companyName">PT. Jalan Baru</h1>
      <div class="site"><span id="i-pin"></span> <span id="siteName">Site A</span></div>
      <div class="clock-big" id="clockTime">--:--:--</div>
      <div class="date" id="clockDate"></div>
    </div>

    <!-- Hello card -->
    <div class="hello-card">
      <div class="avatar" id="avatar">?</div>
      <div>
        <h2 id="helloName">Halo!</h2>
        <p id="nikLine">NIK: —</p>
      </div>
      <span class="badge badge-info status-pill" id="statusPill">Memeriksa…</span>
    </div>

    <!-- Camera -->
    <div class="cam-card">
      <div class="flex between mb-16">
        <h3 style="font-size:15px">Pratinjau Kamera Depan</h3>
        <button class="btn btn-ghost" id="btnCam" style="padding:8px 12px;font-size:12.5px"><span id="i-cam"></span> <span id="camBtnText">Aktifkan Kamera</span></button>
      </div>
      <div class="cam-box" id="camBox">
        <video id="video" autoplay playsinline muted style="display:none"></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div class="cam-placeholder" id="camPlaceholder">
          <span id="i-cam-big"></span>
          <p id="camHint">Kamera belum aktif. Tekan "Aktifkan Kamera" untuk mulai.<br><small style="opacity:.7">Memerlukan izin akses kamera (HTTPS).</small></p>
        </div>
        <div class="cam-overlay"></div>
        <div class="scan-line"></div>
      </div>
      <div class="mt-16 text-sm text-muted flex gap-8" id="gpsLine" style="display:none">
        <span id="i-gps"></span> <span id="gpsText">Mengambil lokasi…</span>
      </div>
    </div>

    <!-- Absen button -->
    <button class="btn btn-accent btn-block btn-lg" id="btnAbsen" style="font-size:17px;padding:18px">
      <span id="i-absen"></span> <span id="absenText">ABSEN MASUK</span>
    </button>
    <p class="text-center text-xs text-muted mt-8" id="absenHint">Tekan tombol untuk mencatat kehadiran Anda hari ini.</p>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    var sess = PH.requireRole('worker');
    document.getElementById('logo').innerHTML = PH.icon('hard-hat');
    document.getElementById('i-out').innerHTML = PH.icon('logout');
    document.getElementById('i-pin').innerHTML = PH.icon('map-pin');
    document.getElementById('i-cam').innerHTML = PH.icon('camera');
    document.getElementById('i-cam-big').innerHTML = PH.icon('camera');
    document.getElementById('i-gps').innerHTML = PH.icon('map-pin');
    document.getElementById('i-absen').innerHTML = PH.icon('scan-face');
    document.getElementById('companyName').textContent = PH.getCompany().name;
    document.getElementById('siteName').textContent = sess.site;
    document.getElementById('helloName').textContent = 'HALO, ' + sess.nama.toUpperCase().split(' ')[0] + '!';
    document.getElementById('nikLine').textContent = 'NIK: ' + sess.nik;
    document.getElementById('avatar').textContent = PH.initials(sess.nama);
    PH.startClock(document.getElementById('clockDate'), document.getElementById('clockTime'));

    var stream = null, lat = null, lng = null, cameraOn = false;
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');

    function refreshStatus(){
      var rec = PH.todayRecord(sess.workerId);
      var pill = document.getElementById('statusPill');
      var btn = document.getElementById('btnAbsen');
      var txt = document.getElementById('absenText');
      var hint = document.getElementById('absenHint');
      if (!rec) {
        pill.className = 'badge badge-warning status-pill'; pill.textContent = 'Belum Absen';
        txt.textContent = 'ABSEN MASUK';
        hint.textContent = 'Tekan tombol untuk mencatat kehadiran Anda hari ini.';
        btn.disabled = false;
      } else if (!rec.checkOut) {
        pill.className = 'badge badge-success status-pill'; pill.textContent = 'Sudah Masuk · ' + PH.fmtWaktu(rec.checkIn);
        txt.textContent = 'ABSEN PULANG';
        hint.textContent = 'Anda sudah absen masuk. Tekan tombol saat pulang kerja.';
        btn.disabled = false;
      } else {
        pill.className = 'badge badge-info status-pill'; pill.textContent = 'Selesai · Pulang ' + PH.fmtWaktu(rec.checkOut);
        txt.textContent = 'ABSEN SELESAI HARI INI';
        hint.textContent = 'Anda sudah menyelesaikan absensi hari ini. Sampai jumpa besok!';
        btn.disabled = true;
        btn.className = 'btn btn-ghost btn-block btn-lg';
      }
    }
    refreshStatus();

    // Camera
    document.getElementById('btnCam').addEventListener('click', function(){
      if (cameraOn) { stopCam(); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        PH.toast('Browser tidak mendukung kamera. Anda tetap bisa absen tanpa foto.', 'error');
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: {ideal:640}, height:{ideal:480} }, audio: false })
        .then(function(s){
          stream = s; video.srcObject = s; video.style.display='block';
          document.getElementById('camPlaceholder').style.display='none';
          document.getElementById('camBox').classList.add('active');
          document.getElementById('camBtnText').textContent = 'Matikan Kamera';
          cameraOn = true;
        })
        .catch(function(err){
          document.getElementById('camHint').innerHTML = 'Tidak dapat mengakses kamera: ' + err.message + '<br><small style="opacity:.7">Pastikan menggunakan HTTPS dan izinkan akses kamera. Absen tetap dapat dilakukan tanpa foto.</small>';
          PH.toast('Akses kamera ditolak. Absen tetap bisa dilakukan.', 'error');
        });
    });
    function stopCam(){
      if (stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
      video.style.display='none';
      document.getElementById('camPlaceholder').style.display='block';
      document.getElementById('camBox').classList.remove('active');
      document.getElementById('camBtnText').textContent = 'Aktifkan Kamera';
      cameraOn = false;
    }

    function capturePhoto(){
      if (!cameraOn) return null;
      try {
        var w = 240, h = Math.round(240 * video.videoHeight / (video.videoWidth||1)) || 180;
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', 0.6);
      } catch(e){ return null; }
    }

    // GPS
    if (navigator.geolocation) {
      document.getElementById('gpsLine').style.display='flex';
      navigator.geolocation.getCurrentPosition(function(pos){
        lat = pos.coords.latitude; lng = pos.coords.longitude;
        document.getElementById('gpsText').textContent = 'Lokasi terdeteksi: ' + lat.toFixed(5) + ', ' + lng.toFixed(5) + ' (akurasi ±' + Math.round(pos.coords.accuracy) + ' m)';
      }, function(){
        document.getElementById('gpsText').textContent = 'Lokasi tidak tersedia (izin ditolak).';
      }, { timeout: 8000 });
    }

    // Absen
    document.getElementById('btnAbsen').addEventListener('click', function(){
      var btn = document.getElementById('btnAbsen');
      btn.disabled = true;
      var rec = PH.todayRecord(sess.workerId);
      var photo = capturePhoto();
      setTimeout(function(){
        if (!rec) {
          var r = PH.checkIn({id:sess.workerId, nik:sess.nik, nama:sess.nama, site:sess.site}, photo, lat, lng);
          stopCam();
          location.href = 'absen-sukses.html?type=masuk&id=' + r.id;
        } else if (!rec.checkOut) {
          var r2 = PH.checkOut(rec.id, photo);
          stopCam();
          location.href = 'absen-sukses.html?type=pulang&id=' + r2.id;
        }
      }, 600);
    });
  </script>
</body>
</html>
