<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pekerja — Pantau Hadir</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/images/logo-pantau-hadir.jpg">
</head>
<body class="worker-body">
  <div class="worker-wrap">
    <!-- ORANGE TOP BAR -->
    <div class="orange-topbar">
      <a href="#" class="keluar-btn" data-logout><img src="assets/images/icons/log-out.svg" width="18" height="18" alt=""> Keluar</a>
    </div>

    <!-- IDENTITAS -->
    <div class="w-identity">
      <div class="logo-box"><img class="logo-img" src="assets/images/logo-pantau-hadir.jpg" alt="Pantau Hadir"></div>
      <div>
        <div class="pt" id="companyName">PT. JALAN BARU</div>
        <div class="site" id="siteName">SITE A - KALI MALANG</div>
      </div>
    </div>

    <h1 class="halo" id="helloName">HALO!</h1>
    <p class="status-line">STATUS: <span class="badge badge-success" id="statusText" style="font-size:11px">MEMERIKSA…</span></p>

    <!-- KAMERA (kotak hitam sesuai Figma) -->
    <div class="cam-figma" id="camBox">
      <video id="video" autoplay playsinline muted style="display:none;width:100%;height:100%;object-fit:cover"></video>
      <canvas id="canvas" style="display:none"></canvas>
      <button type="button" class="cam-activate" id="btnActivate">
        TEKAN UNTUK<br>AKTIFKAN<br>KAMERA DEPAN
      </button>
      <div class="cam-oval" id="camOval" style="display:none"></div>
      <div class="cam-scan-h" id="camScan" style="display:none"></div>
    </div>

    <!-- ABSEN (nonaktif sampai kamera aktif) -->
    <button class="btn-absen" id="btnAbsen" disabled>
      <img src="assets/images/icons/scan-face.svg" width="22" height="22" alt=""> <span id="absenText">ABSEN</span>
    </button>
    <p class="text-center text-xs text-muted mt-8" id="absenHint">Aktifkan kamera terlebih dahulu untuk dapat absen.</p>

    <div class="text-center text-sm text-muted mt-8 flex gap-8" id="gpsLine" style="display:none;justify-content:center">
      <img src="assets/images/icons/map-pin-check.svg" width="16" height="16" alt=""> <span id="gpsText">Mengambil lokasi…</span>
    </div>

    <!-- SERVER TIME FOOTER -->
    <div class="server-footer">
      <div class="lbl">Waktu Server</div>
      <div class="val"><span id="clockDate"></span> · <span id="clockTime"></span></div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    var sess = PH.requireRole('worker');
    document.getElementById('companyName').textContent = PH.getCompany().name.toUpperCase();
    document.getElementById('siteName').textContent = sess.site.toUpperCase();
    document.getElementById('helloName').textContent = 'HALO, ' + sess.nama.toUpperCase().split(' ')[0] + '!!';
    PH.startClock(document.getElementById('clockDate'), document.getElementById('clockTime'));

    var stream = null, lat = null, lng = null, cameraOn = false, insideGeofence = true;
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var btnActivate = document.getElementById('btnActivate');
    var btnAbsen = document.getElementById('btnAbsen');

    function refreshStatus(){
      var rec = PH.todayRecord(sess.workerId);
      var txt = document.getElementById('absenText');
      var hint = document.getElementById('absenHint');
      var st = document.getElementById('statusText');
      st.textContent = insideGeofence ? 'DI DALAM AREA PROYEK' : 'DI LUAR AREA PROYEK';
      st.className = 'badge badge-' + (insideGeofence ? 'success' : 'danger');
      if (!rec) {
        txt.textContent = 'ABSEN MASUK';
        hint.textContent = cameraOn ? 'Tekan tombol untuk mencatat kehadiran Anda hari ini.' : 'Aktifkan kamera terlebih dahulu untuk dapat absen.';
      } else if (!rec.checkOut) {
        txt.textContent = 'ABSEN PULANG';
        hint.textContent = 'Anda sudah absen masuk pukul ' + PH.fmtWaktu(rec.checkIn) + '. Tekan tombol saat pulang.';
      } else {
        txt.textContent = 'ABSEN SELESAI HARI INI';
        hint.textContent = 'Anda sudah menyelesaikan absensi hari ini. Sampai jumpa besok!';
      }
      btnAbsen.disabled = !cameraOn || (!!rec && !!rec.checkOut) || !insideGeofence;
    }

    function activateCam(){
      if (cameraOn) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        PH.toast('Browser tidak mendukung kamera.', 'error'); return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false })
        .then(function(s){
          stream = s; video.srcObject = s; video.style.display='block';
          btnActivate.style.display = 'none';
          document.getElementById('camOval').style.display = 'block';
          document.getElementById('camScan').style.display = 'block';
          cameraOn = true;
          PH.toast('Kamera aktif. Silakan absen.', 'success');
          refreshStatus();
        })
        .catch(function(err){
          PH.toast('Akses kamera ditolak. Izinkan kamera untuk absen.', 'error');
        });
    }
    btnActivate.addEventListener('click', activateCam);
    document.getElementById('camBox').addEventListener('click', function(e){
      if (!cameraOn && e.target === btnActivate) return; // handled
      if (!cameraOn) activateCam();
    });

    function capturePhoto(){
      if (!cameraOn) return null;
      try {
        var w = 240, h = 320;
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        var vw = video.videoWidth || 640, vh = video.videoHeight || 480;
        var scale = Math.max(w/vw, h/vh), dw = vw*scale, dh = vh*scale;
        ctx.drawImage(video, (w-dw)/2, (h-dh)/2, dw, dh);
        return canvas.toDataURL('image/jpeg', 0.6);
      } catch(e){ return null; }
    }

    if (navigator.geolocation) {
      document.getElementById('gpsLine').style.display='flex';
      navigator.geolocation.getCurrentPosition(function(pos){
        lat = pos.coords.latitude; lng = pos.coords.longitude;
        insideGeofence = true;
        document.getElementById('gpsText').textContent = 'Lokasi terverifikasi: ' + lat.toFixed(5) + ', ' + lng.toFixed(5) + ' (±' + Math.round(pos.coords.accuracy) + ' m)';
        refreshStatus();
      }, function(){
        insideGeofence = true;
        document.getElementById('gpsText').textContent = 'Lokasi tidak dapat dibaca.';
        refreshStatus();
      }, { timeout: 8000 });
    }
    refreshStatus();

    btnAbsen.addEventListener('click', function(){
      if (!cameraOn) return;
      btnAbsen.disabled = true;
      var rec = PH.todayRecord(sess.workerId);
      var photo = capturePhoto();
      setTimeout(function(){
        if (!rec) {
          var r = PH.checkIn({id:sess.workerId, nik:sess.nik, nama:sess.nama, site:sess.site}, photo, lat, lng);
          if (stream){ stream.getTracks().forEach(function(t){t.stop();}); }
          location.href = 'absen-sukses.html?type=masuk&id=' + r.id;
        } else if (!rec.checkOut) {
          var r2 = PH.checkOut(rec.id, photo);
          if (stream){ stream.getTracks().forEach(function(t){t.stop();}); }
          location.href = 'absen-sukses.html?type=pulang&id=' + r2.id;
        }
      }, 600);
    });
  </script>
</body>
</html>
